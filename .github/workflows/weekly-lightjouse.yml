name: Weekly Lighthouse Audit
on:
  schedule:
    - cron: "30 3 * * 6"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chrome Stable
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | gpg --batch --yes --dearmor | sudo tee /usr/share/keyrings/google-chrome.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update && sudo apt-get install -y google-chrome-stable
      - run: npm install
      - name: Run Lighthouse & Update Sheet
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
          LIGHTHOUSE_SHEET_ID: ${{ secrets.LIGHTHOUSE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node audit.js
